[tool.uv.workspace]
members = ["packages/*"]

# Virtual workspace root (no [project] table): it only orchestrates the member
# packages under packages/*. The deployable app is `sync-api`.

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "sqlacodegen>=3.0",
    "asgi-lifespan>=2.1",
    "psycopg[binary]>=3.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src"]

[tool.ruff.lint]
# A strict, modern rule set. See https://docs.astral.sh/ruff/rules/
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "A",           # flake8-builtins
    "C4",          # flake8-comprehensions
    "SIM",         # flake8-simplify
    "TCH",         # flake8-type-checking
    "PTH",         # flake8-use-pathlib
    "RUF",         # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "TC001", "TC002", "TC003"]
# Generated by sqlacodegen from the live schema (ADR-0004) — the schema's shape, not ours.
# E501: CHECK-constraint SQL that cannot be wrapped. A003: every table's `id` primary key.
"packages/core/src/sync_core/models.py" = ["E501", "A003"]
# FastAPI resolves route and dependency annotations at runtime, so an import moved into a
# `TYPE_CHECKING` block turns into a NameError the moment the app starts. The TC rules
# cannot tell those annotations apart from the type-only ones.
"packages/api/src/sync_api/**" = ["TC001", "TC002", "TC003"]
# Same problem one layer down: pydantic resolves a model's annotations when it builds the
# model, so a field's type has to be importable at run time.
"packages/parsers/src/sync_parsers/schema.py" = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session: the engine's asyncpg connections are pooled across
# tests, and a connection cannot outlive the loop it was opened on.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error"]
markers = [
    # Hits the real OpenAI API: needs a key, costs money, and is not deterministic. Run it
    # deliberately with `-m ai_live`; everything else parses with the fake extractor.
    "ai_live: exercises a real AI provider, excluded from the default run",
]
# `-m "not ai_live"` here rather than in CI, so a bare `pytest` never spends money.
addopts = "-ra --strict-markers --strict-config -m 'not ai_live'"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# asyncpg ships no type information; it is reached through SQLAlchemy everywhere except
# the test harness's reset connection.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
