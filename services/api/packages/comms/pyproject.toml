[project]
name = "sync-comms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "super", email = "moofk2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # The prose. Autoescaping is what keeps a candidate's own name out of the markup.
    "jinja2>=3.1",
    # Jinja's own escaping, named because the recruiter-message template reaches for it
    # directly rather than getting it through an autoescaped `{{ }}`.
    "markupsafe>=3.0",
    # The delivery provider. Confined to this package, behind the `EmailSender` port
    # everything else imports — the same arrangement `sync-parsers` has for extraction.
    # The `async` extra is the httpx client `send_async` needs.
    "resend[async]>=2.15.0",
    "sync-core",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
sync-core = { workspace = true }
