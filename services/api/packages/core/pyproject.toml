[project]
name = "sync-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "super", email = "moofk2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "pgvector>=0.4",
    # Google's libphonenumber, ported. The browser runs the same rules through
    # `libphonenumber-js`, so a number the field accepted is never one the API refuses.
    "phonenumbers>=9.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=25.1",
    "supabase>=2.31.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"
