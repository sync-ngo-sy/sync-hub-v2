[project]
name = "sync-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "super", email = "moofk2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    # GoTrue is reached over plain HTTP (see `sync_api.auth.gotrue`), and its access tokens
    # are verified locally against the JWKS it publishes — hence the asymmetric algorithms
    # PyJWT only has with `cryptography` installed.
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "email-validator>=2.2",
    "sync-core",
    "sync-ingestion",
    "sync-parsers",
    "sync-rag",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
sync-core = { workspace = true }
sync-rag = { workspace = true }
sync-parsers = { workspace = true }
sync-ingestion = { workspace = true }
