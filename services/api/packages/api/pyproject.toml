[project]
name = "sync-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "super", email = "moofk2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Request-id generation, validation, header echo and the contextvar every log line
    # reads it from. Only the access log below it is ours.
    "asgi-correlation-id>=5.0",
    "fastapi>=0.139.2",
    "httpx>=0.28",
    # The counting behind the auth rate limit — the primitive `slowapi` is built on.
    "limits>=5.8",
    # What pydantic's `EmailStr` validates with.
    "email-validator>=2.2",
    "sync-core",
    "sync-ingestion",
    "sync-parsers",
    "sync-rag",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
sync-core = { workspace = true }
sync-rag = { workspace = true }
sync-parsers = { workspace = true }
sync-ingestion = { workspace = true }
