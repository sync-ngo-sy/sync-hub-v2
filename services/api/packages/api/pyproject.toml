[project]
name = "sync-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "super", email = "moofk2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Request-id generation, validation, header echo and the contextvar every log line
    # reads it from. Only the access log below it is ours.
    "asgi-correlation-id>=5.0",
    "fastapi>=0.139.2",
    "httpx>=0.28",
    # The counting behind every rate limit — the primitive `slowapi` is built on. The memory
    # store it ships with needs no extra; the redis client for a fleet's shared store is added
    # by the deployment image (`limits[async-redis]`), so a single instance carries neither it
    # nor its Windows-only transitive tail.
    "limits>=5.8",
    # What pydantic's `EmailStr` validates with.
    "email-validator>=2.2",
    "sync-assessments",
    "sync-core",
    "sync-ingestion",
    "sync-parsers",
    "sync-rag",
    "uvicorn[standard]>=0.51.0",
    # What FastAPI parses a multipart body with — without it an `UploadFile` route is a
    # startup error. The CV and avatar uploads are the only ones.
    "python-multipart>=0.0.32",
    # Starlette's own concurrency library, named explicitly because the CV upload reaches
    # for `to_thread` directly rather than getting it by accident.
    "anyio>=4.14.2",
    # Decodes, squares and re-encodes an uploaded avatar. The WebP encoder ships with the
    # wheel, so there is no system libwebp to install alongside it.
    "pillow>=12.0",
]

[project.scripts]
# What the container runs: uvicorn with the trusted-proxy boundary read from settings, which a
# bare `uvicorn sync_api.main:app` cannot do because that boundary is a per-deployment value.
sync-api = "sync_api.main:serve"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
sync-assessments = { workspace = true }
sync-core = { workspace = true }
sync-rag = { workspace = true }
sync-parsers = { workspace = true }
sync-ingestion = { workspace = true }
