[project]
name = "sync-worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "super", email = "moofk2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # The worker is an HTTP service now, not a loop: a webhook and a schedule call it.
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "sync-comms",
    "sync-core",
    "sync-ingestion",
    "sync-parsers",
    "sync-rag",
]

[project.scripts]
# Serves the drain endpoints; the API is `uvicorn sync_api.main:app` alongside it.
sync-worker = "sync_worker.main:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
sync-comms = { workspace = true }
sync-core = { workspace = true }
sync-ingestion = { workspace = true }
sync-parsers = { workspace = true }
sync-rag = { workspace = true }
