[project]
name = "sync-worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "super", email = "moofk2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "sync-comms",
    "sync-core",
    "sync-ingestion",
    "sync-parsers",
    "sync-rag",
]

[project.scripts]
# The deployable command, alongside the API's `uvicorn sync_api.main:app`.
sync-worker = "sync_worker.main:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
sync-comms = { workspace = true }
sync-core = { workspace = true }
sync-ingestion = { workspace = true }
sync-parsers = { workspace = true }
sync-rag = { workspace = true }
