<!--
  Signup confirmation. The API chooses the portal through `{{ .RedirectTo }}`; the SPA takes
  the `token_hash` from this URL and posts it to `POST /v1/auth/confirm-email`, which is what
  actually redeems it behind the API per ADR-0005.
-->
<h2>Confirm your email</h2>

<p>Welcome to Sync Hub. Confirm this address to activate your account and sign in.</p>

<p>
  <a href="{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup">
    Confirm my email
  </a>
</p>

<p>If you did not create a Sync Hub account, ignore this message.</p>
