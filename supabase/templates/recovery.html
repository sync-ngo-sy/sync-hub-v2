<!--
  Password reset. The API chooses the account's portal through `{{ .RedirectTo }}`; the SPA
  posts the `token_hash` to `POST /v1/auth/password-reset/confirm` with the new password.
-->
<h2>Reset your password</h2>

<p>Follow this link to choose a new password for your Sync account.</p>

<p>
  <a href="{{ .RedirectTo }}/auth/reset-password?token_hash={{ .TokenHash }}&type=recovery">
    Choose a new password
  </a>
</p>

<p>If you did not ask for a password reset, ignore this message — nothing has changed.</p>
