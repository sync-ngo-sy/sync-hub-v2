# Included into every location that sets a header of its own, because nginx replaces the
# inherited add_header set rather than merging it: a location with one add_header of its own
# gets none of the server block's. Declaring these once at server level looks like it works
# and silently sends nothing.
#
# A staff portal has no business in a search index, in either environment. IAP hides it from
# the internet anyway; this is the belt to that braces, and it costs nothing.
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
