# RECORD ONLY — never applied by tooling. Both apply-org-policy.sh and the Org policy
# workflow refuse organisation-scoped files, and CI asserts that they do.
#
# Transcribed from the live policy on 2026-07-30. Committed so the exception in this
# directory can be read against the constraints it lives beside, in one diff.
#
# Domain restricted sharing used to be recorded here too. It is now actively managed, in
# org-drs-tag-exception.yaml, because the exception is expressed as a conditional rule
# inside that policy rather than as a separate project-scoped override.

# Enforced, and the reason Workload Identity Federation is mandatory for CI rather than
# merely preferred: no service-account key can be minted to authenticate with instead.
name: organizations/471724145580/policies/iam.disableServiceAccountKeyCreation
spec:
  rules:
    - enforce: true
