[project]
name = "manatal-migration"
version = "1.0.0"
description = "A one-off migration of Manatal candidates and their CVs into Sync."
requires-python = ">=3.12"
dependencies = [
    # Manatal, GoTrue and Supabase Storage are all plain REST.
    "httpx>=0.28",
    # Postgres directly. This script writes rows the platform's own schema defines; it does not
    # import the platform's code, so that neither can drift into the other.
    "asyncpg>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.2", "ruff>=0.14"]

# Deliberately not a workspace member and not installable: `uv run` inside this directory picks
# this file up, and the modules import each other as siblings. Nothing in the repository has to
# know this folder exists, and deleting it leaves no dangling reference.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
