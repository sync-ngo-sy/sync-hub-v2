# Job names are `Analyze javascript-typescript` and `Analyze python` because those are the
# checks the branch ruleset requires. Free for public repositories.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The skills tree under `.claude/skills/` is vendored -- `skills-lock.json` names the
      # upstream of each one. An alert in it is not ours to correct here; the correction goes
      # upstream, and until it lands the alert sits in this repository's security tab with no
      # action attached to it. Today the tree holds Markdown, YAML and one shell template, which
      # neither extractor reads, so this excludes nothing yet. It is here so that stays true when
      # a skill arrives carrying JavaScript. `paths-ignore` applies because neither language
      # builds. `.agents/skills` is the symlink to the same files (#328).
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - .claude/skills
              - .agents/skills

      # No build step: both languages are interpreted, so CodeQL's default extraction is
      # enough and a build would only add the workspace install to every run.
      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
