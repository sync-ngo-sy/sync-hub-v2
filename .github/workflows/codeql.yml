# Job names are `Analyze javascript-typescript` and `Analyze python` because those are the
# checks the branch ruleset requires. Free for public repositories.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `.claude/skills/` is vendored agent tooling -- 107 JavaScript files, ~67,000 lines, none
      # of it ours and none of it reachable from any application. Scanned, it is 67,000 lines of
      # somebody else's code in this repository's security results, and it lengthens the slowest
      # step of the loop for a finding nobody here can act on: the fix belongs upstream.
      # `skills-lock.json` records where each skill came from, so an upstream advisory is answered
      # by re-vendoring, not by a CodeQL alert. `.agents/skills` is a symlink to the same tree and
      # is listed so the exclusion holds if CodeQL ever follows it.
      #
      # `prototype/` is deliberately absent: it is ours, so it stays scanned.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - .claude/skills
              - .agents/skills

      # No build step: both languages are interpreted, so CodeQL's default extraction is
      # enough and a build would only add the workspace install to every run.
      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
