name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # services/api (Python) is checked in the `api` job instead, so these
      # are scoped to the JS/TS workspaces to avoid needing uv here too.
      - name: Lint
        run: pnpm exec turbo run lint --filter='./apps/*' --filter='./packages/*'

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter='./apps/*' --filter='./packages/*'

      - name: Build
        run: pnpm exec turbo run build --filter='./apps/*' --filter='./packages/*'

      - name: Test
        run: pnpm exec turbo run test --filter='./apps/*' --filter='./packages/*'

  api:
    name: API (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          working-directory: services/api
          enable-cache: true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Typecheck (pyright)
        run: uv run pyright

      # The suite drives the app against the real stack — the real Postgres with the real
      # migrations and triggers, plus GoTrue and Storage. Only services no test touches are
      # excluded, to keep startup short.
      - name: Start Supabase
        working-directory: .
        run: supabase start -x studio,imgproxy,edge-runtime,realtime,vector,analytics,meta

      - name: Test (pytest)
        run: uv run pytest

      - name: Stop Supabase
        if: always()
        working-directory: .
        run: supabase stop --no-backup
