name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Repository format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `biome ci` rather than the root `check` script, which passes --write and would
      # report success after rewriting the tree.
      - name: Biome
        run: pnpm exec biome ci .

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # services/api (Python) is checked in the `api` job instead, so these
      # are scoped to the JS/TS workspaces to avoid needing uv here too.
      - name: Lint
        run: pnpm exec turbo run lint --filter='./apps/*' --filter='./packages/*'

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter='./apps/*' --filter='./packages/*'

      - name: Build
        run: pnpm exec turbo run build --filter='./apps/*' --filter='./packages/*'

      - name: Test
        run: pnpm exec turbo run test --filter='./apps/*' --filter='./packages/*'

  api:
    name: API (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          working-directory: services/api
          enable-cache: true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned, like the deploy workflows. `latest` resolves through GitHub's release API on
          # every run, unauthenticated, so a run fails on somebody else's traffic -- exit 127,
          # "command not found", before a single migration is read.
          version: 2.113.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Typecheck (pyright)
        run: uv run pyright

      # The suite drives the app against the real stack — the real Postgres with the real
      # migrations and triggers, plus GoTrue and Storage. Only services no test touches are
      # excluded, to keep startup short.
      - name: Start Supabase
        working-directory: .
        run: supabase start -x studio,imgproxy,edge-runtime,realtime,vector,analytics,meta

      - name: Test (pytest)
        run: uv run pytest

      - name: Stop Supabase
        if: always()
        working-directory: .
        run: supabase stop --no-backup

  migrations:
    name: Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned, like the deploy workflows. `latest` resolves through GitHub's release API on
          # every run, unauthenticated, so a run fails on somebody else's traffic -- exit 127,
          # "command not found", before a single migration is read.
          version: 2.113.0

      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,realtime,vector,analytics,meta

      # `start` already applies the set; the reset proves it applies from an empty database
      # rather than from whatever the previous state happened to be. --no-seed because
      # supabase/seed.sql is local fixtures and reference data ships as a migration.
      - name: Replay from a standing start
        run: supabase db reset --local --no-seed

      - name: Applied versions
        run: supabase migration list --local

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # CI applies the environment roots and deliberately never applies `projects/`: that root creates
  # projects, attaches billing and grants project-level IAM, and automating it would hand a deploy
  # token authority the whole design refuses it.
  #
  # The gap that leaves is that a change merged there takes effect only when somebody remembers to
  # run it, and nothing says so. It cost a `404 Requested entity was not found` in an unrelated
  # deploy step -- correct configuration, in a root nothing had applied (#282).
  #
  # So: plan, never apply. `-refresh=false` compares configuration against state without reading a
  # single resource, which is precisely the "declared but never applied" signal and needs no
  # permission beyond the state bucket. It notably needs no billing access; refreshing
  # `google_billing_budget` would, and this identity must not have it.
  projects-applied:
    name: Projects root applied
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5
          # The action wraps `tofu` in a script that reports the run through step outputs, and
          # that wrapper does not pass `-detailed-exitcode`'s 2 back to the shell -- it answers 0.
          # This check is built entirely on telling 2 apart from 0, so the wrapper has to go.
          tofu_wrapper: false

      - name: Authenticate to Google Cloud
        run: |
          set -euo pipefail
          provider="projects/870458118919/locations/global/workloadIdentityPools/github/providers/sync-hub-v2"
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=//iam.googleapis.com/${provider}" \
            | jq -r '.value' > "${RUNNER_TEMP}/oidc.jwt"
          test -s "${RUNNER_TEMP}/oidc.jwt"
          gcloud iam workload-identity-pools create-cred-config "${provider}" \
            --service-account="planner@sync-ngo-prod.iam.gserviceaccount.com" \
            --credential-source-file="${RUNNER_TEMP}/oidc.jwt" \
            --output-file="${RUNNER_TEMP}/cred.json" --quiet
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/cred.json" >> "${GITHUB_ENV}"

      # `-lock=false` because taking a lock is a write, and this identity holds objectViewer.
      # `-detailed-exitcode` makes 2 mean "there is something to apply", which is the failure.
      - name: Plan
        working-directory: infra/terraform/projects
        env:
          TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
        run: |
          set -euo pipefail
          tofu init -input=false

          # Read the code into a variable rather than branching on the command. An `if` treats
          # every non-zero alike, so the one number this check is about -- 2, meaning there is
          # something to apply -- arrives looking exactly like the failure of the plan itself.
          set +e
          tofu plan -input=false -refresh=false -lock=false -detailed-exitcode -no-color
          code=$?
          set -e

          case "${code}" in
            0) echo "The projects root matches its state." ;;
            2)
              echo "::error::infra/terraform/projects has changes that have never been applied."
              echo "::error::CI does not apply this root on purpose -- it holds billing and project"
              echo "::error::authority. Run it by hand, then this check passes:"
              echo "::error::  export TF_VAR_billing_account=...   # gcloud billing accounts list"
              echo "::error::  cd infra/terraform/projects && tofu init && tofu apply"
              exit 1
              ;;
            *) echo "::error::The plan itself failed (exit ${code})."; exit "${code}" ;;
          esac

      - name: Revoke credentials
        if: always()
        run: gcloud auth revoke --all --quiet || true

  images:
    # Named per matrix value, not both targets: GitHub appends it in parentheses, so
    # "Images (api, worker)" rendered as "Images (api, worker) (api)". The worker leg is
    # named for the check the branch ruleset requires.
    name: ${{ matrix.target == 'worker' && 'Worker' || 'Image (api)' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Built, not pushed: this job proves the Dockerfile and the lockfile still agree. The
      # GitHub Actions cache keeps the dependency layer between runs.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: services/api
          file: services/api/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: sync-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      # Not the entry points themselves: `sync_api.main` and `sync-worker` both build Settings at
      # import, and this job has no environment to give them.
      - name: Smoke (the package imports)
        run: |
          docker run --rm --entrypoint python "sync-${{ matrix.target }}:${{ github.sha }}" \
            -c 'import ${{ matrix.target == 'api' && 'sync_api.app' || 'sync_worker.main' }}'
